services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLUMBLINE_PORT:-3003}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plumbline

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-plumbline}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://plumbline.srv1427612.hstgr.cloud}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - plumbline

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - plumbline-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - plumbline

networks:
  plumbline:
    driver: bridge

volumes:
  plumbline-mongo:
